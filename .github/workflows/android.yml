name: Android Build

# 触发：手动、推送到 main、或打 v* 标签（打标签时会把 APK 附到 Release）
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci 会触发 postinstall -> patch-package，自动重打 @react-native/gradle-plugin 补丁
      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 安装项目锁定的 SDK 组件（新架构需要 NDK + CMake）
      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.1.12297006" \
                     "cmake;3.22.1"

      # 可选：若配置了 RELEASE_KEYSTORE_BASE64 secret，则还原 keystore 用于正式签名；
      # 否则 build.gradle 自动回退 debug 签名（APK 仍可安装测试）。
      - name: Restore release keystore (optional)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.keystore

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 打 v* 标签时，把 APK 附到 GitHub Release
      - name: Attach APKs to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
