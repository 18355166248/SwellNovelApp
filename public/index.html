<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#eceae3" />
  <title>Swell小说</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background: #eceae3;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #root { display: flex; }
    /* 手机浏览器上把应用约束在竖屏阅读器的合理宽度内并居中 */
    @media (min-width: 720px) {
      body { background: radial-gradient(120% 120% at 50% 0%, #e6e3da 0%, #d2cfc5 100%); }
      #root {
        width: 420px;
        max-width: 100%;
        margin: 0 auto;
        box-shadow: 0 20px 60px -20px rgba(31, 61, 58, .35);
        background: #eceae3;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
